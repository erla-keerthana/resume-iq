services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8001
      - ALLOWED_ORIGINS=http://10.10.0.36:5174
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      - PORT=5174
      - BACKEND_URL=http://backend:8001
      - ORIGIN=http://10.10.0.36:5174
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-uploads:
